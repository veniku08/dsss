<form (ngSubmit)="onSubmit()" #form="ngForm" class="form-grid">

  <div class="form-group">
    <label>Vehículo</label>
    <select [(ngModel)]="incident.vehicleId" name="vehicleId" required>
      <option [ngValue]="0" disabled>-- Selecciona un vehículo --</option>
      <option *ngFor="let v of vehicles" [ngValue]="v.id">
        {{ v.plate }} - {{ v.brand }} {{ v.model }}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label>Conductor</label>
    <select [(ngModel)]="incident.driverId" name="driverId" required>
      <option [ngValue]="0" disabled>-- Selecciona un conductor --</option>
      <option *ngFor="let d of drivers" [ngValue]="d.id">
        {{ d.name }} ({{ d.licenseNumber || 'Sin licencia' }})
      </option>
    </select>
  </div>

  <div class="form-group full-width">
    <label>Descripción</label>
    <textarea [(ngModel)]="incident.description" name="description" required rows="3"
              placeholder="Describe la incidencia..."></textarea>
  </div>

  <div class="form-group">
    <label>Severidad</label>
    <select [(ngModel)]="incident.severity" name="severity" required>
      <option value="LOW">Baja</option>
      <option value="MEDIUM">Media</option>
      <option value="HIGH">Alta</option>
      <option value="CRITICAL">Crítica</option>
    </select>
  </div>

  <div class="form-group">
    <label>Fecha</label>
    <input type="datetime-local" [(ngModel)]="incident.date" name="date" required>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-cancel" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn-save" [disabled]="!form.valid">Guardar</button>
  </div>

</form>
