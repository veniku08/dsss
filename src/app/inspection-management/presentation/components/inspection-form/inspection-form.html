<form (ngSubmit)="onSubmit()" #form="ngForm" class="form-grid">

  <div class="form-group">
    <label>Vehículo</label>
    <select [(ngModel)]="inspection.vehicleId" name="vehicleId" required>
      <option [ngValue]="0" disabled>-- Selecciona un vehículo --</option>
      <option *ngFor="let v of vehicles" [ngValue]="v.id">
        {{ v.plate }} - {{ v.brand }} {{ v.model }}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label>Inspector / Conductor</label>
    <select [(ngModel)]="inspection.inspectorId" name="inspectorId" required>
      <option [ngValue]="0" disabled>-- Selecciona un inspector --</option>
      <option *ngFor="let d of drivers" [ngValue]="d.id">
        {{ d.name }} ({{ d.licenseNumber || 'Sin licencia' }})
      </option>
    </select>
  </div>

  <div class="form-group full-width">
    <label>Fecha y hora</label>
    <input type="datetime-local" [(ngModel)]="inspection.date" name="date" required>
  </div>

  <div class="form-group full-width">
    <label>Lista de verificación</label>
    <div class="checklist">
      <div class="checklist-row" *ngFor="let item of inspection.items; let i = index">
        <span class="checklist-name">{{ item.name }}</span>
        <select [(ngModel)]="inspection.items[i].status" [name]="'item-' + i" required>
          <option value="OK">✓ OK</option>
          <option value="FAIL">✗ Falla</option>
        </select>
      </div>
    </div>
  </div>

  <div class="form-group full-width">
    <label>Observaciones</label>
    <textarea [(ngModel)]="inspection.observations" name="observations" rows="3"
              placeholder="Notas adicionales..."></textarea>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-cancel" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn-save" [disabled]="!form.valid">Guardar</button>
  </div>

</form>
